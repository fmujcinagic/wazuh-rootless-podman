#!/usr/bin/env ansible-playbook
# Build the offline bundle on an internet-connected host.
#
#   ansible-playbook build-bundle.yml
#
# The resulting wazuh-bundle.tar.gz is the only artifact that needs to
# cross the air gap. It carries the container images, the project tree
# (without the demo certificates), the checksum manifest and the Ansible
# collections required by the deployment.
- name: Build the offline Wazuh bundle
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../.."
    wazuh_version: "4.14.7"
    certs_generator_image: "docker.io/wazuh/wazuh-certs-generator:0.0.4"
    bundle_images:
      - "docker.io/wazuh/wazuh-indexer:{{ wazuh_version }}"
      - "docker.io/wazuh/wazuh-manager:{{ wazuh_version }}"
      - "docker.io/wazuh/wazuh-dashboard:{{ wazuh_version }}"
      - "docker.io/wazuh/wazuh-agent:{{ wazuh_version }}"
      - "{{ certs_generator_image }}"
    bundle_collections:
      - containers.podman
      - ansible.posix

  vars_prompt:
    - name: bundle_out_dir
      prompt: "Directory to write the bundle to"
      default: "{{ playbook_dir }}/dist"
      private: false

  tasks:
    - name: Create the bundle tree
      file:
        path: "{{ bundle_out_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [images, project, collections]

    - name: Pull the images
      command: podman pull -q {{ item }}
      loop: "{{ bundle_images }}"
      changed_when: true

    - name: Export each image to a docker-archive
      vars:
        fname: "{{ item | relpath('docker.io') | replace('/', '-') | replace(':', '-') }}.tar"
      command: podman save --format docker-archive -o {{ bundle_out_dir }}/images/{{ fname }} {{ item }}
      args:
        creates: "{{ bundle_out_dir }}/images/{{ fname }}"
      loop: "{{ bundle_images }}"

    - name: Export the project tree without git metadata
      shell: set -e -o pipefail; git -C "{{ repo_root }}" archive --format=tar HEAD | tar -x -C "{{ bundle_out_dir }}/project"
      args:
        executable: /bin/bash
        creates: "{{ bundle_out_dir }}/project/README.md"

    - name: Clear any previously downloaded collections
      file:
        path: "{{ bundle_out_dir }}/collections"
        state: absent

    - name: Recreate the collections directory
      file:
        path: "{{ bundle_out_dir }}/collections"
        state: directory
        mode: "0755"

    - name: Download the collections the deployment needs
      command: >
        ansible-galaxy collection download {{ bundle_collections | join(' ') }}
        -p {{ bundle_out_dir }}/collections
      environment:
        ANSIBLE_GALAXY_DISABLE_GPG_VERIFY: "1"
      changed_when: true

    - name: Collect file checksums
      stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop: >-
        {{ (q('fileglob', bundle_out_dir ~ '/images/*.tar')
            + q('fileglob', bundle_out_dir ~ '/collections/*.tar.gz')) | sort }}
      register: bundle_files

    - name: Write the manifest
      template:
        src: manifest.yml.j2
        dest: "{{ bundle_out_dir }}/manifest.yml"
        mode: "0644"

    - name: Pack the bundle
      archive:
        path:
          - "{{ bundle_out_dir }}/images"
          - "{{ bundle_out_dir }}/project"
          - "{{ bundle_out_dir }}/collections"
          - "{{ bundle_out_dir }}/manifest.yml"
        dest: "{{ bundle_out_dir }}/wazuh-bundle-{{ wazuh_version }}.tar.gz"
        format: gz
        mode: "0644"

    - name: Show the result
      debug:
        msg: "Bundle ready: {{ bundle_out_dir }}/wazuh-bundle-{{ wazuh_version }}.tar.gz"
