---
# Render everything that the Quadlet units reference: the units themselves
# plus the manager cluster configuration. Indexer files and the dashboard
# config only render on the master (shared_render.yml).

- name: Create the Quadlet directory
  file:
    path: "{{ wazuh_home }}/.config/containers/systemd"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0755"

- name: Role facts for the render below
  set_fact:
    wazuh_cluster_enabled: "{{ wazuh_node_role == 'worker' or (wazuh_node_role == 'master' and wazuh_cluster_key | length > 0) }}"

- name: Render the master specific config
  include_tasks: shared_render.yml
  when: wazuh_node_role == 'master'

- name: Render the manager cluster configuration
  template:
    src: wazuh_manager.conf.j2
    dest: "{{ wazuh_config_dir }}/wazuh_cluster/wazuh_manager.conf"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0644"
  register: manager_conf_rendered
  when: wazuh_node_role != 'agent'

- name: Render the agent Quadlet unit
  template:
    src: wazuh-agent.container.j2
    dest: "{{ wazuh_home }}/.config/containers/systemd/wazuh-agent.container"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0644"
  when: wazuh_node_role != 'master'
