---
# Render everything that the Quadlet units reference: the units themselves
# plus the manager cluster configuration. Indexer files and the dashboard
# config only render on the master (shared_render.yml).

- name: Create the Quadlet directory
  file:
    path: "{{ wazuh_home }}/.config/containers/systemd"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0755"

- name: Role facts for the render below
  set_fact:
    wazuh_cluster_enabled: "{{ wazuh_node_role == 'worker' or (wazuh_node_role == 'master' and wazuh_cluster_key | length > 0) }}"
    wazuh_units_changed: false

- name: Locate the integrations hub for the manager configuration
  stat:
    path: "{{ wazuh_hub_path }}"
  delegate_to: localhost
  become: false
  register: hub_dir

- name: Hub availability fact for the render
  set_fact:
    wazuh_hub_available: "{{ wazuh_hub_enabled | bool and hub_dir.stat.exists | default(false) }}"

- name: Render the master specific config
  include_tasks: shared_render.yml
  when: wazuh_node_role == 'master'

- name: Render the worker Quadlet units
  template:
    src: "{{ item }}"
    dest: "{{ wazuh_home }}/.config/containers/systemd/{{ item | regex_replace('\\.j2$', '') }}"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0644"
  register: worker_units_rendered
  when: wazuh_node_role == 'worker'
  loop:
    - wazuh.network.j2
    - wazuh-manager.container.j2

- name: Track the change of the worker units
  set_fact:
    wazuh_units_changed: "{{ wazuh_units_changed or worker_units_rendered is changed }}"

- name: Render the manager cluster configuration
  template:
    src: wazuh_manager.conf.j2
    dest: "{{ wazuh_config_dir }}/wazuh_cluster/wazuh_manager.conf"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0644"
  register: units_rendered
  when: wazuh_node_role != 'agent'

- name: Track the change of the manager configuration
  set_fact:
    wazuh_units_changed: "{{ wazuh_units_changed or units_rendered is changed }}"

- name: Render the agent Quadlet unit
  template:
    src: wazuh-agent.container.j2
    dest: "{{ wazuh_home }}/.config/containers/systemd/wazuh-agent.container"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0644"
  register: agent_units_rendered
  when: wazuh_node_role != 'master'

- name: Track the change of the agent unit
  set_fact:
    wazuh_units_changed: "{{ wazuh_units_changed or agent_units_rendered is changed }}"
  when: wazuh_node_role != 'master'

- name: Persist the unit-change marker for interrupted runs
  file:
    path: "{{ wazuh_install_root }}/.units-changed"
    state: touch
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0600"
    modification_time: preserve
  when: wazuh_units_changed | bool
