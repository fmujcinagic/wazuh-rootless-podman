---
# Start the stack via systemd user units. Linger is enabled so the user
# manager and the containers survive reboots and disconnects. The node role
# decides which units make sense: master = indexer/manager/dashboard,
# worker = manager plus its own agent, agent = the agent only.

- name: Pick up the new Quadlet units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Check that the wazuh network exists
  command: podman network inspect wazuh
  register: network_check
  failed_when: false
  changed_when: false
  when: wazuh_node_role != 'agent'

# The quadlet network unit runs create --ignore, which also swallows real
# errors, then it can start with no network in place.
- name: Create the wazuh network when it is missing
  command: podman network create wazuh
  when:
    - wazuh_node_role != 'agent'
    - network_check.rc | default(1) != 0

- name: Start the units of this node
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    scope: user
  register: unit_start
  retries: 2
  delay: 5
  loop: "{{ ({'master': ['wazuh-indexer.service', 'wazuh-manager.service', 'wazuh-dashboard.service'],
              'worker': ['wazuh-manager.service', 'wazuh-agent.service'],
              'agent': ['wazuh-agent.service']})[wazuh_node_role] }}"
  loop_control:
    label: "{{ item }}"

- name: Wait for the indexer to answer on its API
  uri:
    url: "https://127.0.0.1:{{ wazuh_indexer_port }}/"
    validate_certs: false
    status_code: [200, 401]
    client_cert: "{{ wazuh_install_root }}/config/wazuh_indexer_ssl_certs/admin.pem"
    client_key: "{{ wazuh_install_root }}/config/wazuh_indexer_ssl_certs/admin-key.pem"
  register: indexer_ready
  until: indexer_ready.status in [200, 401]
  retries: 30
  delay: 20
  changed_when: false
  when: wazuh_node_role == 'master'

# A changed unit (published ports moved, for example) only takes effect
# with a restart, an already running container ignores it.
- name: Restart the units whose definition changed
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    scope: user
  loop: >-
    {{ ({'master': ['wazuh-indexer.service', 'wazuh-manager.service', 'wazuh-dashboard.service'],
         'worker': ['wazuh-manager.service', 'wazuh-agent.service'],
         'agent': ['wazuh-agent.service']})[wazuh_node_role] }}
  when: wazuh_units_changed | default(false)
  loop_control:
    label: "{{ item }}"

# A rebuilt user database has to reach the manager and dashboard too; they
# pick the passwords up as environment at container start.
- name: Restart the stack for the rebuilt credentials
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    scope: user
  loop:
    - wazuh-indexer.service
    - wazuh-manager.service
    - wazuh-dashboard.service
  when:
    - wazuh_node_role == 'master'
    - users_rendered is defined
    - users_rendered is changed
