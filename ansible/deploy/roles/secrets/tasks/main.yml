---
# First-run credential handling. Passwords set in group_vars win, otherwise
# they are generated once and kept in vault/<host>.yml so repeat runs are
# idempotent. Encrypt that file with ansible-vault once the run succeeds.

- name: Check for a credentials file from a previous run
  stat:
    path: "{{ wazuh_secrets_file }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: secrets_file

- name: Make sure the vault directory exists
  file:
    path: "{{ wazuh_secrets_file | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  when: not secrets_file.stat.exists

- name: Fill in any missing password
  set_fact:
    wazuh_indexer_password: "{{ wazuh_indexer_password or lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', '-_.'], length=24) }}"
    wazuh_dashboard_password: "{{ wazuh_dashboard_password or lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', '-_.'], length=24) }}"
    wazuh_api_password: "{{ wazuh_api_password or lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', 'punctuation'], length=20) }}"
  run_once: true
  no_log: true
  when: not secrets_file.stat.exists

- name: Persist the credentials on the control node
  copy:
    dest: "{{ wazuh_secrets_file }}"
    mode: "0600"
    content: |
      # Written by the secrets role. Encrypt with:
      #   ansible-vault encrypt {{ wazuh_secrets_file | relpath(playbook_dir) }}
      wazuh_indexer_password: "{{ wazuh_indexer_password }}"
      wazuh_dashboard_password: "{{ wazuh_dashboard_password }}"
      wazuh_api_password: "{{ wazuh_api_password }}"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when: not secrets_file.stat.exists

- name: Load the credentials file
  include_vars:
    file: "{{ wazuh_secrets_file }}"
  no_log: true

- name: Remind about vault encryption
  debug:
    msg: "New credentials written to {{ wazuh_secrets_file }} - encrypt it with ansible-vault."
  run_once: true
  when: not secrets_file.stat.exists
