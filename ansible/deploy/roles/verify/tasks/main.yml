---
# End-to-end checks once everything is up. Run over the loopback interface,
# the same as any local client would reach the published ports.

- name: Check the manager API
  uri:
    url: "https://127.0.0.1:{{ wazuh_api_port }}/security/user/authenticate?raw=true"
    user: wazuh-wui
    password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: api_root
  until: api_root.status == 200
  retries: 20
  delay: 15
  changed_when: false
  when: wazuh_node_role != 'agent'

- name: Check the dashboard is serving
  uri:
    url: "https://127.0.0.1:{{ wazuh_dashboard_port }}/"
    validate_certs: false
    status_code: [200, 302, 401]
  register: dash_root
  until: dash_root.status in [200, 302, 401]
  retries: 20
  delay: 15
  changed_when: false
  when: wazuh_node_role == 'master'

- name: Check the agent service is up
  command: systemctl --user is-active wazuh-agent.service
  register: agent_active
  until: agent_active.stdout == 'active'
  retries: 20
  delay: 15
  changed_when: false
  when: wazuh_node_role != 'master'

- name: Summary
  vars:
    node_title: "{{ 'Wazuh master' if wazuh_node_role == 'master' else ('Wazuh worker' if wazuh_node_role == 'worker' else 'Wazuh agent') }}"
    node_addr: "{{ ansible_host | default(inventory_hostname) }}"
  debug:
    msg: >-
      {{
        [
          node_title ~ ' is up on ' ~ node_addr ~ ':',
          'credentials are stored in ' ~ wazuh_secrets_file
        ]
        + (['  dashboard  https://' ~ node_addr ~ ':' ~ wazuh_dashboard_port] if wazuh_node_role == 'master' else [])
        + (['  indexer    https://' ~ node_addr ~ ':' ~ wazuh_indexer_port] if wazuh_node_role == 'master' else [])
        + (['  API        https://' ~ node_addr ~ ':' ~ wazuh_api_port] if wazuh_node_role != 'agent' else [])
        + (['  agent      ' ~ wazuh_agent_name ~ ' enrolled against ' ~ wazuh_agent_manager_host] if wazuh_node_role != 'master' else [])
        + (['  cluster    ' ~ wazuh_cluster_name ~ ' (master ' ~ wazuh_cluster_master_host ~ ')'] if wazuh_node_role == 'worker' else [])
        + (['  login      admin / ' ~ wazuh_indexer_password] if wazuh_node_role == 'master' else [])
      }}
