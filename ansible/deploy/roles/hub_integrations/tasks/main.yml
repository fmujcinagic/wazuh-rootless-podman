---
# Loads the wazuh-integration-hub: decoders and rules into every manager
# through a Quadlet drop-in, the podman and network bandwidth collectors on
# the nodes that carry an agent, and the index templates plus dashboards on
# the master. Everything is skipped unless wazuh_hub_path points at a hub
# checkout on the control machine.

- name: Locate the integrations hub on the control machine
  stat:
    path: "{{ wazuh_hub_path }}"
  delegate_to: localhost
  become: false
  register: hub_dir

- name: Hub availability fact
  set_fact:
    wazuh_hub_available: "{{ wazuh_hub_enabled | bool and hub_dir.stat.exists | default(false) }}"

- name: Note an unusable hub configuration
  debug:
    msg: >-
      wazuh_hub_enabled with no existing wazuh_hub_path, skipping the
      integrations hub
  when:
    - wazuh_hub_enabled | bool
    - not (hub_dir.stat.exists | default(false))

- name: Install the hub layout on the target
  file:
    path: "{{ wazuh_install_root }}/integrations/{{ item }}"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0755"
  loop:
    - hub-decoders
    - hub-rules
    - podman/scripts
    - network/scripts
  when: wazuh_hub_available | bool

- name: Remove the decoder directories of the old layout
  file:
    path: "{{ wazuh_install_root }}/integrations/{{ item }}"
    state: absent
  loop:
    - podman/decoders
    - podman/rules
    - network/decoders
    - network/rules
  when: wazuh_hub_available | bool
  loop_control:
    label: "{{ item }}"

- name: Stage the hub decoders and rules into the shared directories
  copy:
    src: "{{ wazuh_hub_path }}/integrations/{{ item.integration }}/{{ item.kind }}/{{ item.file }}"
    dest: "{{ wazuh_install_root }}/integrations/{{ item.dest }}/"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0644"
  loop:
    - { integration: podman, kind: decoders, file: podman_decoders.xml, dest: hub-decoders }
    - { integration: podman, kind: rules, file: podman_rules.xml, dest: hub-rules }
    - { integration: network, kind: decoders, file: network_decoders.xml, dest: hub-decoders }
    - { integration: network, kind: rules, file: network_rules.xml, dest: hub-rules }
    - { integration: keycloak, kind: decoders, file: keycloak_decoders.xml, dest: hub-decoders }
    - { integration: keycloak, kind: rules, file: keycloak_rules.xml, dest: hub-rules }
  when: wazuh_hub_available | bool
  register: hub_files

- name: Stage the collector scripts
  copy:
    src: "{{ wazuh_hub_path }}/integrations/{{ item.integration }}/scripts/"
    dest: "{{ wazuh_install_root }}/integrations/{{ item.integration }}/scripts/"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0755"
  loop:
    - { integration: podman }
    - { integration: network }
  when: wazuh_hub_available | bool
  register: hub_scripts

- name: Make the collector scripts executable
  file:
    path: "{{ wazuh_install_root }}/integrations/{{ item.integration }}/scripts"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0755"
    recurse: true
  loop:
    - { integration: podman }
    - { integration: network }
  when: wazuh_hub_available | bool

- name: Prepare the collector state directories the agent mounts
  file:
    path: "{{ wazuh_home }}/.local/state/{{ item }}"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0755"
  loop:
    - wazuh-podman
    - wazuh-network
    - keycloak
  when: wazuh_hub_available | bool

- name: Create the Quadlet drop-in directory
  file:
    path: "{{ wazuh_home }}/.config/containers/systemd/wazuh-manager.container.d"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0755"
  when: wazuh_hub_available | bool and wazuh_node_role != 'agent'

- name: Mount the hub decoders and rules into the manager
  template:
    src: 10-hub-integrations.conf.j2
    dest: "{{ wazuh_home }}/.config/containers/systemd/wazuh-manager.container.d/10-hub-integrations.conf"
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0644"
  when: wazuh_hub_available | bool and wazuh_node_role != 'agent'
  register: manager_dropin

- name: Track the hub changes for the service restarts
  set_fact:
    wazuh_units_changed: >-
      {{ wazuh_units_changed | bool
         or manager_dropin is changed
         or (hub_files is defined and hub_files is changed)
         or (hub_scripts is defined and hub_scripts is changed) }}

- name: Persist the unit-change marker for interrupted runs
  file:
    path: "{{ wazuh_install_root }}/.units-changed"
    state: touch
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0600"
    modification_time: preserve
  when: wazuh_units_changed | bool

- name: Install the podman monitoring collector
  command: "{{ wazuh_install_root }}/integrations/podman/scripts/install.sh"
  args:
    chdir: "{{ wazuh_install_root }}/integrations/podman/scripts"
  environment:
    HOME: "{{ wazuh_home }}"
  when: wazuh_hub_available | bool and wazuh_node_role != 'master'
  changed_when: true

- name: Install the network bandwidth collector
  command: "{{ wazuh_install_root }}/integrations/network/scripts/install.sh"
  args:
    chdir: "{{ wazuh_install_root }}/integrations/network/scripts"
  environment:
    HOME: "{{ wazuh_home }}"
    WAZUH_MANAGER_SERVER: "{{ '127.0.0.1' if wazuh_node_role == 'worker' else wazuh_agent_manager_host | default('127.0.0.1') }}"
  when: wazuh_hub_available | bool and wazuh_node_role != 'master'
  changed_when: true

- name: Apply the podman index template on the master
  uri:
    url: "https://{{ ansible_host }}:{{ wazuh_indexer_port }}/_template/podman-alerts"
    method: PUT
    user: admin
    password: "{{ wazuh_indexer_password }}"
    validate_certs: false
    headers:
      Content-Type: application/json
    body_format: json
    body: "{{ lookup('file', wazuh_hub_path ~ '/integrations/podman/dashboards/podman_index_template.json') }}"
    status_code: [200, 409]
  delegate_to: localhost
  become: false
  when: wazuh_hub_available | bool and wazuh_node_role == 'master'

- name: Apply the network index template on the master
  uri:
    url: "https://{{ ansible_host }}:{{ wazuh_indexer_port }}/_template/network-alerts"
    method: PUT
    user: admin
    password: "{{ wazuh_indexer_password }}"
    validate_certs: false
    headers:
      Content-Type: application/json
    body_format: json
    body: "{{ lookup('file', wazuh_hub_path ~ '/integrations/network/dashboards/network_index_template.json') }}"
    status_code: [200, 409]
  delegate_to: localhost
  become: false
  when: wazuh_hub_available | bool and wazuh_node_role == 'master'

- name: Import the podman dashboard on the master
  uri:
    url: "https://{{ ansible_host }}:{{ wazuh_dashboard_port }}/api/saved_objects/_import?overwrite=true"
    method: POST
    user: admin
    password: "{{ wazuh_indexer_password }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      osd-xsrf: true
    body_format: form-multipart
    body:
      file:
        filename: podman_dashboards.ndjson
        content_type: application/ndjson
        content: "{{ lookup('file', wazuh_hub_path ~ '/integrations/podman/dashboards/podman_dashboards.ndjson') }}"
    status_code: [200, 409]
  delegate_to: localhost
  become: false
  when: wazuh_hub_available | bool and wazuh_node_role == 'master'

- name: Import the network dashboard on the master
  uri:
    url: "https://{{ ansible_host }}:{{ wazuh_dashboard_port }}/api/saved_objects/_import?overwrite=true"
    method: POST
    user: admin
    password: "{{ wazuh_indexer_password }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      osd-xsrf: true
    body_format: form-multipart
    body:
      file:
        filename: network_dashboards.ndjson
        content_type: application/ndjson
        content: "{{ lookup('file', wazuh_hub_path ~ '/integrations/network/dashboards/network_dashboards.ndjson') }}"
    status_code: [200, 409]
  delegate_to: localhost
  become: false
  when: wazuh_hub_available | bool and wazuh_node_role == 'master'

- name: Apply the keycloak index template on the master
  uri:
    url: "https://{{ ansible_host }}:{{ wazuh_indexer_port }}/_template/keycloak-alerts"
    method: PUT
    user: admin
    password: "{{ wazuh_indexer_password }}"
    validate_certs: false
    headers:
      Content-Type: application/json
    body_format: json
    body: "{{ lookup('file', wazuh_hub_path ~ '/integrations/keycloak/dashboards/keycloak_index_template.json') }}"
    status_code: [200, 409]
  delegate_to: localhost
  become: false
  when: wazuh_hub_available | bool and wazuh_node_role == 'master'

- name: Import the keycloak dashboard on the master
  uri:
    url: "https://{{ ansible_host }}:{{ wazuh_dashboard_port }}/api/saved_objects/_import?overwrite=true"
    method: POST
    user: admin
    password: "{{ wazuh_indexer_password }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      osd-xsrf: true
    body_format: form-multipart
    body:
      file:
        filename: keycloak_dashboards.ndjson
        content_type: application/ndjson
        content: "{{ lookup('file', wazuh_hub_path ~ '/integrations/keycloak/dashboards/keycloak_dashboards.ndjson') }}"
    status_code: [200, 409]
  delegate_to: localhost
  become: false
  when: wazuh_hub_available | bool and wazuh_node_role == 'master'
