---
# Root-side bundle checks. The extraction happens in the images role under
# the wazuh user, so the container store and the staging area stay consistent.

- name: Check that the bundle is present on the target
  stat:
    path: "{{ wazuh_bundle_path }}"
  register: bundle_file

- name: Fail with a helpful message when the bundle is missing
  fail:
    msg: >-
      {{ wazuh_bundle_path }} not found on {{ inventory_hostname }}.
      Build it with ../bundle/build-bundle.yml and copy it to the target
      (wazuh_bundle_path).
  when: not bundle_file.stat.exists

- name: Install root layout
  file:
    path: "{{ wazuh_install_root }}"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0750"

- name: Create a staging area the wazuh user can work in
  file:
    path: "{{ wazuh_stage_dir }}"
    state: directory
    owner: "{{ wazuh_user }}"
    group: "{{ wazuh_group }}"
    mode: "0750"
