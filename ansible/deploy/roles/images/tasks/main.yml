---
# Load the bundled image archives into the rootless store, skipping images
# that are already present at the pinned tag.

- name: List the images already in the store
  command: podman images --format "{{ '{{' }} .Repository {{ '}}' }}:{{ '{{' }} .Tag {{ '}}' }}"
  register: loaded_images
  changed_when: false

- name: Work out which archives still need loading
  set_fact:
    wazuh_image_archives: >-
      {{ wazuh_bundle_manifest.images
         | selectattr('ref', 'in', wazuh_server_images)
         | rejectattr('ref', 'in', loaded_images.stdout_lines)
         | list }}

- name: Load the image archives
  command: podman load -i {{ wazuh_stage_dir }}/{{ item.path }}
  loop: "{{ wazuh_image_archives }}"
  loop_control:
    label: "{{ item.ref }}"
  changed_when: true
