---
# Load the bundled image archives into the rootless store, skipping images
# that are already present at the pinned tag.

- name: Check which of the needed images are already loaded
  command: podman image exists {{ item }}
  args:
    warn: false
  loop: "{{ wazuh_server_images }}"
  register: image_exists
  failed_when: image_exists.rc not in (0, 1)
  changed_when: false

- name: Find the archive for each missing image
  set_fact:
    wazuh_image_archives: >-
      {{ (wazuh_image_archives | default([])) + [ {
           'ref': item.0,
           'path': wazuh_stage_dir ~ '/' ~ (wazuh_bundle_manifest.images
             | selectattr('ref', 'equalto', item.0) | map(attribute='path') | first)
         } ] }}
  loop: "{{ wazuh_server_images | zip(image_exists.results) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  when: item.1.rc != 0

- name: Load the image archives
  containers.podman.podman_image:
    name: "{{ item.ref }}"
    path: "{{ item.path }}"
    load: true
  loop: "{{ wazuh_image_archives | default([]) }}"
  loop_control:
    label: "{{ item.ref }}"
