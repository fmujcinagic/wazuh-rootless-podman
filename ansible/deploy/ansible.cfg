[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = vendor/collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
forks = 10
display_skipped_hosts = false
# The deploy becomes the unprivileged wazuh user for the container work. On
# hosts without setfacl (acl package) Ansible cannot make its temp files
# accessible, so fall back to world-readable temp unless the operator removed
# the ACL package. Harmless on a single-user rootless host.
allow_world_readable_tmpfiles = true

[ssh_connection]
pipelining = true
