# Interactive deployment helper for the Wazuh rootless podman stack.
# Asks everything up front and drives ansible/deploy/deploy.yml.

REPO_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
DEPLOY_DIR="$REPO_DIR/ansible/deploy"

ask() {
    local reply
    read -r -p "$2 [$1]: " reply
    printf -v "$3" '%s' "${reply:-$1}"
}

ask_required() {
    local reply
    while :; do
        read -r -p "$1: " reply
        [[ -n "$reply" ]] && break
        echo "This value is required." >&2
    done
    printf -v "$2" '%s' "$reply"
}

ask_secret() {
    local reply
    read -rs -p "$1: " reply
    echo >&2
    printf -v "$2" '%s' "$reply"
}

ask_yes() {
    local reply
    read -r -p "$1 [y/N]: " reply
    [[ "$reply" =~ ^[Yy]([Ee][Ss])?$ ]]
}

ask_menu() {
    local title="$1"; shift
    local reply i=1
    echo
    echo "$title"
    while [[ "$1" != "--" ]]; do
        printf '  %d) %s\n' "$i" "$1"
        i=$((i + 1)); shift
    done
    shift
    while :; do
        read -r -p "Choice [1-$((i - 1))]: " reply
        [[ "$reply" =~ ^[0-9]+$ ]] && ((reply >= 1 && reply < i)) && break
    done
    printf -v "$1" '%s' "$reply"
}

node_role="master"
target_host="" target_user="rocky-user" sudo_password=""
storage_dir=""

master_host="" master_ssh_user="wazuh" master_tree="/home/wazuh/wazuh-rootless-podman"
cluster_name="wazuh" cluster_key="" indexer_port="9200"
master_indexer_password="" master_api_password=""
worker_node_name="wazuh-worker" master_node_name="wazuh.manager"
copy_certs=no

agent_manager="" agent_name="$(hostname -s 2>/dev/null || echo wazuh-agent)" agent_group="default" syslog_port="5170"
events_port="1514" enrollment_port="1515" indexer_port="9200" dashboard_port="8443" api_port="55000" cluster_port="1516"

echo "$banner_text"
echo
ask_menu "Deployment type" \
    "Standalone server (indexer + manager + dashboard, cluster master)" \
    "Worker manager + local agent (joins an existing master)" \
    "Agent only (enrolled against a remote manager)" -- mode_answer

case "$mode_answer" in
    1) node_role="master" ;;
    2) node_role="worker" ;;
    3) node_role="agent" ;;
esac

case "$node_role" in
    worker)
        echo
        echo "--- Worker node setup ---"
        ask_required "Master manager host or IP" master_host
        ask "$cluster_name" "Cluster name (must match the master)" cluster_name
        ask "$cluster_key" "Cluster key (32 hex chars, same as on the master)" cluster_key
        [[ -n "$cluster_key" ]] || {
            echo "Without the master's cluster key the worker cannot join." >&2
            exit 1
        }
        echo
        echo "The worker ships its events into the master's indexer, so it also"
        echo "needs the master's passwords. They live in vault/<master-host>.yml"
        echo "inside the master deployment directory."
        ask_secret "Master indexer admin password" master_indexer_password
        ask_secret "Master API password" master_api_password
        echo
        if ask_yes "Pull the manager certificate files from the master over ssh now"; then
            ask "wazuh" "Ssh user on the master (the rootless stack user)" master_ssh_user
            ask "/home/wazuh/wazuh-rootless-podman" "Project tree path on the master" master_tree
            copy_certs=yes
        else
            echo
            echo "Copy root-ca-manager.pem, wazuh.manager.pem and wazuh.manager-key.pem"
            echo "from the master to /var/tmp/wazuh-worker-certs on the target yourself,"
            echo "then continue."
        fi
        ask "wazuh-worker" "This node's name inside the cluster" worker_node_name
        ask "wazuh.manager" "The master's cluster node_name" master_node_name
        ;;
    agent)
        echo
        echo "--- Agent-only setup ---"
        ask_required "Manager host or IP to enroll against" agent_manager
        ask "$events_port" "Manager events port" events_port
        ask "$enrollment_port" "Manager enrollment port" enrollment_port
        ask "$agent_name" "Agent name" agent_name
        ask "$agent_group" "Agent group" agent_group
        ;;
esac

echo
echo "--- Target VM ---"
ask_required "Host or IP of the target VM" target_host
ask "$target_user" "Ssh user on the target (needs sudo)" target_user
ask_secret "Sudo password for $target_user" sudo_password
ask "" "Podman storage directory (blank for default)" storage_dir
ask "wazuh" "Rootless stack user on the target (created if missing)" stack_user

echo
echo "Published ports (rootless cannot bind below 1024)."
echo "Remap them to whatever the target VM leaves available."
ask "$events_port" "Manager events port (container :1514)" events_port
ask "$enrollment_port" "Manager enrollment port (container :1515)" enrollment_port
ask "$syslog_port" "Manager syslog port (container :514/udp)" syslog_port
if [[ "$node_role" == master ]]; then
    ask "$indexer_port" "Indexer port (container :9200)" indexer_port
    ask "$dashboard_port" "Dashboard port (container :5601)" dashboard_port
fi
ask "$cluster_port" "Cluster port (container :1516)" cluster_port

if ask_yes "Fresh VM: install podman and python3 over ssh before deploying"; then
    echo "Installing podman and python3 on $target_host ..."
    ssh "$target_user@$target_host" \
        "sudo -S -p '' dnf install -y podman python3 policycoreutils-python-utils" <<< "$sudo_password"
else
    echo
    echo "Checking the deployment prerequisites on $target_host ..."
    remote_env="$(ssh "$target_user@$target_host" "command -v podman >/dev/null 2>&1 && echo has_podman; command -v python3 >/dev/null 2>&1 && echo has_python3; command -v semanage >/dev/null 2>&1 && echo has_semanage; getenforce 2>/dev/null" 2>/dev/null)"
    echo "$remote_env" | grep -q has_podman && has_podman=yes || has_podman=no
    echo "$remote_env" | grep -q has_python3 && has_python3=yes || has_python3=no
    echo "$remote_env" | grep -q has_semanage && has_semanage=yes || has_semanage=no
    echo "$remote_env" | grep -qxq Enforcing && selinux_enforcing=yes || selinux_enforcing=no
    echo
    echo "Prerequisites on $target_host:"
    [[ "$has_podman" == yes ]] && mark="[x]" || mark="[ ]"
    printf '  %s podman 4.4+                       (quadlet, secrets, rootless stack)\n' "$mark"
    [[ "$has_python3" == yes ]] && mark="[x]" || mark="[ ]"
    printf '  %s python3                           (ansible interpreter on the target)\n' "$mark"
    if [[ "$selinux_enforcing" == yes ]]; then
        [[ "$has_semanage" == yes ]] && mark="[x]" || mark="[ ]"
        printf '  %s policycoreutils-python-utils      (semanage, needed with SELinux enforcing)\n' "$mark"
        if [[ "$has_semanage" == no && -n "$storage_dir" ]]; then
            echo "      SELinux enforcing + custom storage root: $storage_dir must be labelled."
        fi
    else
        echo '  [x]SELinux is not enforcing, no policy tools needed'
    fi
    missing=""
    [[ "$has_podman" == no ]] && missing="$missing podman"
    [[ "$has_python3" == no ]] && missing="$missing python3"
    [[ "$selinux_enforcing" == yes && "$has_semanage" == no ]] && missing="$missing policycoreutils-python-utils"
    if [[ -n "$missing" ]]; then
        echo
        echo "Missing:$missing"
        echo "The playbook preflight would stop on any of these anyway."
        if ask_yes "Install the missing packages over ssh now"; then
            ssh "$target_user@$target_host" \
                "sudo -S -p '' dnf install -y$missing" <<< "$sudo_password"
        else
            echo
            echo "Continuing without them. Expect the playbook to fail in preflight" >&2
            echo "until these are installed on the target:$missing" >&2
        fi
    else
        echo
        echo "All prerequisites are present. Continuing."
    fi
fi

if [[ "$node_role" == worker && "$copy_certs" == yes ]]; then
    echo
    echo "Copying the manager certificate files from $master_ssh_user@$master_host."
    echo "You will be asked for the ssh password of that master user."
    ssh "$target_user@$target_host" \
        "mkdir -p /var/tmp/wazuh-worker-certs && chmod 0777 /var/tmp/wazuh-worker-certs"
    for cert_file in root-ca-manager.pem wazuh.manager.pem wazuh.manager-key.pem; do
        scp -3 \
            "$master_ssh_user@$master_host:$master_tree/config/wazuh_indexer_ssl_certs/$cert_file" \
            "$target_user@$target_host:/var/tmp/wazuh-worker-certs/$cert_file"
    done
fi

extra=()
extra+=(-e "wazuh_node_role=$node_role")
extra+=(-e "wazuh_user=$stack_user")

# Sensitive values (sudo/ssh passwords, cluster key, master passwords) go into
# an extra-vars file instead of the command line, which any local user could
# read from ps. The file is mode 0600 and removed after the run.
yaml_escape() {
    local s=$1
    s=${s//\\/\\\\}
    s=${s//\"/\\\"}
    printf '%s' "$s"
}

secret_vars="$DEPLOY_DIR/vault/extra-vars.yml"
mkdir -p "$DEPLOY_DIR/vault"
(
    umask 077
    {
        echo "# Rendered by wazuh.cfg, never present in the command line."
        printf 'ansible_become_pass: "%s"\n' "$(yaml_escape "$sudo_password")"
        case "$node_role" in
            worker)
                printf 'wazuh_cluster_key: "%s"\n' "$(yaml_escape "$cluster_key")"
                printf 'wazuh_indexer_password: "%s"\n' "$(yaml_escape "$master_indexer_password")"
                printf 'wazuh_api_password: "%s"\n' "$(yaml_escape "$master_api_password")"
                ;;
        esac
    } > "$secret_vars"
)
chmod 600 "$secret_vars"

case "$node_role" in
    worker)
        extra+=(-e "wazuh_cluster_name=$cluster_name")
        extra+=(-e "wazuh_cluster_master_host=$master_host")
        extra+=(-e "wazuh_cluster_master_node_name=$master_node_name")
        extra+=(-e "wazuh_worker_node_name=$worker_node_name")
        extra+=(-e "wazuh_manager_indexer_url=https://$master_host:$indexer_port")
        extra+=(-e "wazuh_agent_manager_host=127.0.0.1")
        extra+=(-e "wazuh_agent_name=$target_host")
        ;;
    agent)
        extra+=(-e "wazuh_agent_manager_host=$agent_manager")
        extra+=(-e "wazuh_agent_name=$agent_name")
        extra+=(-e "wazuh_agent_group=$agent_group")
        ;;
esac

extra+=(-e "wazuh_agent_events_port=$events_port")
extra+=(-e "wazuh_agent_enrollment_port=$enrollment_port")
extra+=(-e "wazuh_syslog_port=$syslog_port")
extra+=(-e "wazuh_cluster_port=$cluster_port")
if [[ "$node_role" == master ]]; then
    extra+=(-e "wazuh_indexer_port=$indexer_port")
    extra+=(-e "wazuh_dashboard_port=$dashboard_port")
fi

[[ -n "$storage_dir" ]] && extra+=(-e "wazuh_storage_root=$storage_dir")

mkdir -p "$DEPLOY_DIR/inventory"
cat > "$DEPLOY_DIR/inventory/hosts.yml" <<EOF
# Rendered by wazuh.cfg. The ansible_user needs sudo on the target.
wazuh_server:
  hosts:
    wazuh-target:
      ansible_host: $target_host
      ansible_user: $target_user
EOF

echo
echo "Running: ansible-playbook deploy.yml -i inventory/hosts.yml (secrets via $secret_vars)"
echo
cd "$DEPLOY_DIR"
rc=0
ansible-playbook deploy.yml -i inventory/hosts.yml "${extra[@]}" -e @"$secret_vars" || rc=$?
rm -f "$secret_vars"
exit "$rc"
